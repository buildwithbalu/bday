<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b18"/>
      <stop offset="100%" stop-color="#080806"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2cc"/>
      <stop offset="50%" stop-color="#dfb15b"/>
      <stop offset="100%" stop-color="#b38728"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <circle cx="400" cy="300" r="280" fill="none" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3"/>
  <circle cx="400" cy="300" r="200" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.4"/>
  <circle cx="400" cy="300" r="120" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.6"/>

  <!-- Outer Elegant Border -->
  <rect x="25" y="25" width="750" height="550" rx="20" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.75"/>
  <rect x="35" y="35" width="730" height="530" rx="14" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.25"/>

  <!-- Corner Ornaments -->
  <circle cx="25" cy="25" r="4" fill="#dfb15b"/>
  <circle cx="775" cy="25" r="4" fill="#dfb15b"/>
  <circle cx="25" cy="575" r="4" fill="#dfb15b"/>
  <circle cx="775" cy="575" r="4" fill="#dfb15b"/>

  <!-- Central Icon & Badge -->
  <circle cx="400" cy="240" r="65" fill="#121220" stroke="url(#gold)" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="258" font-size="54" text-anchor="middle" dominant-baseline="middle">🌄</text>

  <!-- Title & Subtitle -->
  <text x="400" y="360" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="bold" fill="url(#gold)" text-anchor="middle">Peaceful Enough to Stay Forever</text>
  <text x="400" y="405" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" fill="#e2e8f0" text-anchor="middle" opacity="0.9">Some memories are quiet, but they never fade</text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" letter-spacing="3" fill="#a0aec0" text-anchor="middle" text-transform="uppercase">Replace with personal photo in assets folder</text>
</svg>